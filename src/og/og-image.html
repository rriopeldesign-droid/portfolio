<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Share image</title>
<!-- The Open Graph / Twitter card image (1200x630). To regenerate img/og/og-robert-riopel.jpg:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=5000 --screenshot=og.png src/og/og-image.html
     sips -s format jpeg -s formatOptions 88 og.png --out img/og/og-robert-riopel.jpg
     Then copy it over img/og-image.jpg too, so old links get the new picture. -->
<link href="/css/fonts.css" rel="stylesheet" />
<style>
  :root {
    --cream: rgb(245 240 235);
    --peach: rgb(254 177 146);
    --jungle: rgb(1 179 108);
    --forest: rgb(1 43 29);
    --night: #010609;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--night); }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(620px 420px at 18% 108%, rgb(1 179 108 / 0.30), transparent 70%),
      radial-gradient(900px 600px at 30% 40%, rgb(1 43 29 / 1), transparent 75%),
      linear-gradient(160deg, rgb(1 43 29) 0%, #021a12 55%, var(--night) 100%);
    font-family: "Inter Tight", system-ui, sans-serif; color: var(--cream);
  }
  /* the forest, quietly, along the bottom */
  .pines { position: absolute; left: 0; bottom: 0; width: 1200px; height: 150px; z-index: 1; }
  .grain {
    position: absolute; inset: 0; opacity: 0.10; mix-blend-mode: overlay;
    background-image: url("../../img/grain.png"); background-size: 256px;
  }
  .portrait {
    position: absolute; top: 0; right: 0; width: 520px; height: 630px;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgb(0 0 0 / 0.55) 22%, #000 46%);
            mask-image: linear-gradient(90deg, transparent 0%, rgb(0 0 0 / 0.55) 22%, #000 46%);
  }
  .photo {
    position: absolute; inset: 0;
    background-image: url("../../img/headshot.jpg");
    background-size: 580px auto;
    background-position: 10px -318px;
    filter: grayscale(1) contrast(1.1) brightness(0.95);
  }
  /* tint the photo into the forest and melt its left edge into the dark */
  .photo-tint { position: absolute; inset: 0; background: rgb(1 43 29 / 0.42); mix-blend-mode: multiply; }
  .photo-fade { position: absolute; inset: 0; background: linear-gradient(0deg, rgb(1 6 9 / 0.7) 0%, rgb(1 6 9 / 0) 34%); }
  .copy { z-index: 2; position: absolute; left: 72px; top: 64px; bottom: 60px; width: 640px; display: flex; flex-direction: column; }
  .logo { font-family: "Syne", sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 0.02em; color: var(--cream); }
  .main { margin-top: auto; margin-bottom: auto; }
  .eyebrow { font-weight: 600; font-size: 19px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--peach); }
  h1 { font-family: "Syne", sans-serif; font-weight: 800; font-size: 82px; line-height: 0.98; letter-spacing: -0.01em; margin-top: 18px; }
  .place { display: flex; align-items: center; gap: 12px; margin-top: 26px; font-size: 30px; font-weight: 500; }
  .place svg { width: 26px; height: 26px; color: var(--peach); flex: none; }
  .place .dot { color: rgb(245 240 235 / 0.5); }
  .meta { font-size: 21px; line-height: 1.5; color: rgb(245 240 235 / 0.72); }
  .meta strong { display: block; margin-top: 4px; font-weight: 600; color: var(--cream); }
  .meta .num { color: var(--peach); font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <svg class="pines" viewBox="0 0 1200 230" preserveAspectRatio="none" aria-hidden="true">
      <g fill="#010d09" opacity="0.9">
        <path d="M0 230 L0 150 L18 120 L30 150 L44 92 L60 150 L72 128 L86 150 L102 70 L120 150 L134 118 L150 150 L168 100 L186 150 L200 136 L214 150 L232 84 L250 150 L266 126 L282 150 L300 110 L318 150 L334 138 L350 150 L368 96 L386 150 L402 130 L418 150 L436 118 L454 150 L470 140 L488 150 L506 106 L524 150 L540 132 L556 150 L574 120 L592 150 L610 142 L626 150 L644 112 L662 150 L680 136 L698 150 L716 124 L734 150 L778 120 L790 150 L804 92 L820 150 L832 128 L846 150 L862 70 L880 150 L894 118 L910 150 L928 100 L946 150 L960 136 L974 150 L992 84 L1010 150 L1026 126 L1042 150 L1060 110 L1078 150 L1094 138 L1110 150 L1128 96 L1146 150 L1162 130 L1178 150 L1196 118 L1200 150 L1200 230 Z"/>
      </g>
      <g fill="#010609">
        <path d="M0 230 L0 190 L22 168 L40 190 L58 150 L78 190 L96 176 L114 190 L134 140 L156 190 L176 178 L196 190 L218 160 L240 190 L262 180 L284 190 L306 150 L330 190 L352 182 L374 190 L398 166 L420 190 L444 178 L468 190 L492 156 L516 190 L540 184 L564 190 L590 170 L614 190 L640 182 L666 190 L692 168 L718 190 L782 168 L800 190 L818 150 L838 190 L856 176 L874 190 L894 140 L916 190 L936 178 L956 190 L978 160 L1000 190 L1022 180 L1044 190 L1066 150 L1090 190 L1112 182 L1134 190 L1158 166 L1180 190 L1200 190 L1200 230 Z"/>
      </g>
    </svg>
    <div class="portrait">
      <div class="photo"></div>
      <div class="photo-tint"></div>
      <div class="photo-fade"></div>
    </div>
    <div class="grain"></div>
    <div class="copy">
      <div class="logo">RR</div>
      <div class="main">
        <p class="eyebrow">Senior Product Designer</p>
        <h1>Robert Riopel</h1>
        <p class="place">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          Ottawa <span class="dot">&middot;</span> Vienna
        </p>
      </div>
      <div class="meta">
        <span class="num">$8M+</span> in measurable product impact<br />
        Product UX &middot; Design systems &middot; AI tooling
        <strong>robertriopel.ca</strong>
      </div>
    </div>
  </div>
</body>
</html>

  <style>
    .maze-main { max-width: 680px; margin: 0 auto; padding: 24px 20px 0; }
    .maze-head { text-align: center; margin-bottom: 14px; }
    .maze-head h1 { font-size: 26px; font-weight: 800; color: #fff; letter-spacing: -0.02em; margin-bottom: 4px; }
    .maze-head p { font-size: 10px; color: rgba(255,255,255,0.3); letter-spacing: 0.12em; text-transform: uppercase; }

    #game-wrapper { display: flex; flex-direction: column; align-items: center; gap: 12px; }

    /* HUD */
    #hud {
      display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center;
      font-family: 'Inter Tight', monospace; font-size: 11px;
      color: rgba(255,255,255,0.4); letter-spacing: 0.15em; text-transform: uppercase;
    }
    .hud-item { display: flex; gap: 6px; align-items: baseline; }
    .hud-val { color: rgba(255,255,255,0.85); font-weight: 600; font-variant-numeric: tabular-nums; display: inline-block; }
    .hud-val.has-key { color: #facc15; text-shadow: 0 0 8px rgba(250,204,21,0.4); }
    .hud-val.pop { animation: hudPop 0.45s cubic-bezier(.2,1.6,.4,1); }
    @keyframes hudPop { 0% { transform: scale(1); } 40% { transform: scale(1.6); } 100% { transform: scale(1); } }
    .heart { color: #f97316; text-shadow: 0 0 8px rgba(249,115,22,0.5); margin-right: 2px; transition: color 0.3s, text-shadow 0.3s; }
    .heart.lost { color: rgba(255,255,255,0.12); text-shadow: none; }
    .hud-actions { display: flex; gap: 6px; }
    .hud-btn {
      width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.6);
      cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .hud-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); color: #fff; }
    .hud-btn:disabled { opacity: 0.3; cursor: default; }

    /* Stage */
    #stage {
      position: relative; border-radius: 14px; overflow: hidden;
      box-shadow: 0 0 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
      touch-action: none; user-select: none; -webkit-user-select: none; background: #07090e;
    }
    #game-canvas { display: block; }

    #banner {
      position: absolute; top: 12px; left: 50%; transform: translate(-50%, -8px);
      padding: 7px 16px; border-radius: 999px; white-space: nowrap;
      background: rgba(194,65,12,0.92); color: #fff;
      font-family: 'Inter Tight', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.03em;
      opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s cubic-bezier(.2,1.4,.4,1);
      z-index: 5; box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    #banner.show { opacity: 1; transform: translate(-50%, 0); }
    #banner.blue { background: rgba(37,99,235,0.92); }
    #banner.gold { background: rgba(202,138,4,0.95); }

    /* Overlays */
    #overlay {
      position: absolute; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      background: rgba(7,9,14,0.72); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      opacity: 0; transition: opacity 0.35s ease;
    }
    #overlay[hidden] { display: none; }
    #overlay.show { opacity: 1; }
    #overlay.ov-intro { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; pointer-events: none; }

    .ov-card { text-align: center; max-width: 340px; font-family: 'Inter Tight', sans-serif; }
    #overlay.show .ov-card { animation: cardIn 0.5s cubic-bezier(.2,1.3,.4,1) both; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(0.96); } to { opacity: 1; transform: none; } }
    .ov-emoji { font-size: 44px; margin-bottom: 10px; }
    .ov-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 30px; color: #fff; letter-spacing: -0.02em; margin-bottom: 10px; }
    .ov-sub { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 6px; line-height: 1.5; }
    .ov-sub strong { color: #fff; }
    .ov-sub .gold, .gold { color: #facc15; }
    .ov-fine { color: rgba(255,255,255,0.35); font-size: 11px; letter-spacing: 0.06em; margin-top: 12px; }
    .ov-cta-lead { color: rgba(255,255,255,0.6); font-size: 14px; margin: 18px 0 10px; }
    .ov-actions { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 18px; }
    .ov-rules { list-style: none; padding: 0; margin: 4px auto 22px; text-align: left; width: fit-content; }
    .ov-rules li { color: rgba(255,255,255,0.7); font-size: 13px; padding: 5px 0; display: flex; align-items: center; gap: 10px; }
    .rule-icon { width: 22px; text-align: center; }

    .btn-primary {
      display: inline-block; padding: 12px 30px; background: #C2410C; color: #fff; border: 0; border-radius: 10px;
      font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.03em;
      text-decoration: none; cursor: pointer; transition: background 0.2s, transform 0.15s;
      box-shadow: 0 0 24px rgba(194,65,12,0.35);
    }
    .btn-primary:hover { background: #a3360a; transform: translateY(-1px); }
    .btn-ghost {
      display: inline-block; margin-top: 14px; background: none; border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.55); padding: 8px 20px; border-radius: 8px; cursor: pointer;
      font-family: 'Inter Tight', sans-serif; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s;
    }
    .ov-actions .btn-ghost { margin-top: 0; }
    .btn-ghost:hover { border-color: rgba(255,255,255,0.4); color: #fff; }

    /* Level intro card */
    .intro-card { text-align: center; text-shadow: 0 2px 20px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.8); }
    .intro-tag {
      font-family: 'Inter Tight', sans-serif; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
      color: #fdba74; margin-bottom: 8px; animation: introDrop 0.5s 0.1s cubic-bezier(.2,1.3,.4,1) both;
    }
    .intro-name {
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: clamp(28px, 7vw, 44px); color: #fff;
      letter-spacing: -0.02em; line-height: 1; animation: introZoom 0.6s 0.2s cubic-bezier(.2,1.4,.4,1) both;
    }
    .intro-hint {
      font-family: 'Inter Tight', sans-serif; font-size: 13px; color: rgba(255,255,255,0.75);
      margin-top: 12px; max-width: 300px; animation: introFade 0.5s 0.55s ease both;
    }
    @keyframes introDrop { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
    @keyframes introZoom { from { opacity: 0; transform: scale(1.6); letter-spacing: 0.1em; } to { opacity: 1; transform: none; } }
    @keyframes introFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* Touch controls */
    #touch-controls { display: none; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 4px; margin-top: 4px; }
    @media (pointer: coarse) { #touch-controls { display: grid; } #controls-hint { display: none; } }
    .touch-btn {
      border-radius: 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5); font-size: 20px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none;
      transition: background 0.12s, transform 0.12s; -webkit-tap-highlight-color: transparent;
    }
    .touch-btn.active { background: rgba(194,65,12,0.35); border-color: rgba(194,65,12,0.6); color: #fff; transform: scale(0.92); }
    #controls-hint { font-family: 'Inter Tight', sans-serif; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.25); }

    @media (max-width: 480px) {
      .maze-main { padding-top: 16px; }
      .maze-head { margin-bottom: 8px; }
      .maze-head h1 { font-size: 22px; }
      .maze-head p { display: none; }
      #hud { gap: 8px 14px; }
      .ov-title { font-size: 22px; margin-bottom: 6px; }
      .ov-rules { margin-bottom: 14px; }
      .ov-rules li { font-size: 12px; padding: 3px 0; }
      .ov-emoji { font-size: 32px; margin-bottom: 4px; }
      .ov-fine { margin-top: 8px; }
      #touch-controls { grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro-tag, .intro-name, .intro-hint, #overlay.show .ov-card, .hud-val.pop { animation: none; }
    }

    #void-teaser { text-align: center; padding: 30px 20px 50px; }
    #void-teaser p {
      font-size: 10px; color: rgba(255,255,255,0.15); letter-spacing: 0.2em; text-transform: uppercase;
      margin-bottom: 10px; font-family: 'Inter Tight', sans-serif;
    }
    #void-teaser a {
      font-family: 'Inter Tight', sans-serif; font-size: 11px; color: rgba(255,255,255,0.12); text-decoration: none;
      letter-spacing: 0.25em; text-transform: uppercase; transition: all 0.5s; display: inline-block;
      padding: 10px 24px; border: 1px solid rgba(255,255,255,0.06); border-radius: 8px;
    }
    #void-teaser a:hover {
      color: #ff0055; letter-spacing: 0.4em; text-shadow: 0 0 20px rgba(255,0,85,0.4);
      border-color: rgba(255,0,85,0.2); background: rgba(255,0,85,0.03);
    }
  </style>
</head>

  <main class="maze-main">
    <div class="maze-head">
      <h1 class="font-display">Escape the Maze</h1>
      <p>Key → Door → Chest · Dodge the ghosts · Grab ⚡ to hunt them</p>
    </div>
    <div id="game-wrapper">
      <div id="hud">
        <div class="hud-item">Lvl <span class="hud-val" id="hud-level">1/6</span></div>
        <div class="hud-item">Score <span class="hud-val" id="hud-score">0</span></div>
        <div class="hud-item">Lives <span class="hud-val" id="hud-lives"></span></div>
        <div class="hud-item">Key <span class="hud-val" id="hud-key">—</span></div>
        <div class="hud-item">Time <span class="hud-val" id="hud-time">0:00</span></div>
        <div class="hud-actions">
          <button id="btn-sound" class="hud-btn" type="button" aria-label="Toggle sound"></button>
          <button id="btn-pause" class="hud-btn" type="button" aria-label="Pause"></button>
        </div>
      </div>
      <div id="stage">
        <canvas id="game-canvas" role="img" aria-label="Escape the Maze game board"></canvas>
        <div id="banner" aria-live="polite"></div>
        <div id="overlay" hidden></div>
      </div>
      <div id="touch-controls">
        <div></div><div class="touch-btn" data-dir="up">↑</div><div></div>
        <div class="touch-btn" data-dir="left">←</div><div></div><div class="touch-btn" data-dir="right">→</div>
        <div></div><div class="touch-btn" data-dir="down">↓</div><div></div>
      </div>
      <p id="controls-hint">Arrows / WASD to move · P to pause · M for sound</p>
    </div>
  </main>

  <div id="void-teaser">
    <p>Bored of mazes?</p>
    <a href="/fun2.html">Enter the void →</a>
  </div>

  <script src="/js/game.js"></script>

# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs on purpose. In one job, deploy-pages sometimes looks for the
  # artifact a split second after it is uploaded and finds nothing (actions/deploy-pages#451).
  # Waiting for the build job to finish makes sure the artifact is there.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the last-updated dates can come from git
          fetch-depth: 0
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stamp last-updated dates
        # Sitemap <lastmod> and each page's structured-data dateModified come from git history
        run: python3 .github/scripts/sitemap_lastmod.py
      - name: Assemble the site
        # Publish only what the site serves: no build sources, tooling or dotfiles
        run: |
          mkdir _site
          rsync -a \
            --exclude='.*' --exclude='_site' --exclude='node_modules' --exclude='audits' \
            --exclude='/src' --exclude='/scripts' \
            --exclude='/package.json' --exclude='/package-lock.json' \
            --exclude='/tailwind.config.js' --exclude='/README.md' \
            ./ _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the IndexNow step can see which pages changed in this push
          fetch-depth: 0
      - name: Notify search engines (IndexNow)
        # Lets Bing (and other IndexNow engines) know about changed pages right away.
        # Never blocks or fails the deploy.
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          sleep 30  # give the Pages CDN a moment to serve the new files
          python3 .github/scripts/indexnow.py

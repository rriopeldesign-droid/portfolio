<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <title>??? — Robert Riopel</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f4efe9;
      --dim: rgba(244,239,233,0.42);
      --faint: rgba(244,239,233,0.2);
      --ember: #f97316;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; overflow: hidden; }
    body {
      font-family: 'Inter Tight', system-ui, sans-serif; color: var(--ink);
      -webkit-font-smoothing: antialiased; cursor: none;
      user-select: none; -webkit-user-select: none;
    }
    @media (pointer: coarse) { body { cursor: auto; } #cursor { display: none; } }

    #void { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    /* ── Chrome-less HUD ── */
    .hud {
      position: fixed; z-index: 5; font-size: 10px; letter-spacing: 0.22em; text-transform: lowercase;
      color: var(--dim); transition: opacity 1.2s ease;
    }
    a.hud, button.hud {
      color: inherit; text-decoration: none; background: none; border: 0; font-family: inherit;
      cursor: none; padding: 6px 0; transition: color 0.3s;
    }
    @media (pointer: coarse) { a.hud, button.hud { cursor: pointer; } }
    a.hud:hover, button.hud:hover { color: var(--ink); }
    #back  { top: max(18px, env(safe-area-inset-top)); left: 22px; }
    #sound { top: max(18px, env(safe-area-inset-top)); right: 22px; }
    #readout {
      bottom: max(20px, env(safe-area-inset-bottom)); left: 22px;
      display: grid; grid-template-columns: auto auto; gap: 4px 16px; font-variant-numeric: tabular-nums;
    }
    #readout span:nth-child(odd) { color: var(--faint); }
    #hint {
      bottom: max(20px, env(safe-area-inset-bottom)); right: 22px; text-align: right;
      transition: opacity 0.9s ease, transform 0.9s ease;
    }
    #hint.out { opacity: 0; transform: translateY(6px); }
    body.inside .hud { opacity: 0; pointer-events: none; }
    body.boot .hud { opacity: 0; }

    /* ── Whispers ── */
    #whisper {
      position: fixed; left: 50%; top: 86%; transform: translate(-50%, 0); z-index: 4;
      font-size: 12px; letter-spacing: 0.34em; text-transform: lowercase; color: var(--ink);
      white-space: nowrap; pointer-events: none; opacity: 0; filter: blur(8px);
      transition: opacity 2.2s ease, filter 2.2s ease;
    }
    #whisper.show { opacity: 0.75; filter: blur(0); }

    #typing {
      position: fixed; left: 50%; top: 77%; transform: translateX(-50%); z-index: 4;
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: clamp(18px, 3vw, 28px);
      letter-spacing: 0.08em; color: var(--ink); white-space: pre; pointer-events: none;
      text-shadow: 0 0 24px rgba(249,115,22,0.55);
    }
    #typing:not(:empty)::after {
      content: ''; display: inline-block; width: 2px; height: 0.9em; margin-left: 4px; vertical-align: -0.1em;
      background: var(--ember); animation: caret 1s steps(1) infinite;
    }
    #typing.launch { animation: launch 0.7s cubic-bezier(.6,0,.8,.4) forwards; }
    @keyframes caret { 50% { opacity: 0; } }
    @keyframes launch { to { transform: translate(-50%, -38vh) scale(0.3); opacity: 0; filter: blur(6px); letter-spacing: 0.4em; } }

    #write {
      display: none; position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      z-index: 5;
    }
    @media (pointer: coarse) {
      #write { display: block; bottom: calc(max(20px, env(safe-area-inset-bottom)) + 44px); }
      #whisper { top: 74%; }
      #typing { top: 67%; }
    }
    #write-input { position: fixed; left: -9999px; top: 0; opacity: 0; }

    /* ── Cursor ── */
    #cursor {
      position: fixed; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; z-index: 20;
      border: 1px solid rgba(244,239,233,0.55); border-radius: 50%; pointer-events: none;
      transition: width 0.5s cubic-bezier(.2,.8,.2,1), height 0.5s cubic-bezier(.2,.8,.2,1), margin 0.5s cubic-bezier(.2,.8,.2,1), border-color 0.5s, box-shadow 0.5s;
    }
    #cursor::after {
      content: ''; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px;
      border-radius: 50%; background: var(--ink);
    }
    body.holding #cursor {
      width: 8px; height: 8px; margin: -4px 0 0 -4px; border-color: var(--ember);
      box-shadow: 0 0 18px rgba(249,115,22,0.7);
    }
    body.inside #cursor { opacity: 0.5; }

    /* ── Inside the horizon ── */
    #inside {
      position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
      padding: 24px; pointer-events: none; opacity: 0; transition: opacity 1.4s ease;
    }
    body.inside #inside { opacity: 1; pointer-events: auto; }
    .in-wrap { max-width: 520px; text-align: center; }
    .in-line {
      font-size: clamp(13px, 1.6vw, 15px); font-weight: 300; letter-spacing: 0.16em; text-transform: lowercase;
      color: var(--ink); line-height: 2.1; opacity: 0; filter: blur(10px); transform: translateY(6px);
      transition: opacity 2s ease, filter 2s ease, transform 2s ease;
    }
    .in-line.dim { color: var(--dim); }
    .in-line.show { opacity: 1; filter: blur(0); transform: none; }
    .in-sign { margin-top: 42px; }
    .in-sign .who {
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: clamp(22px, 4vw, 34px);
      letter-spacing: -0.01em; text-transform: none; color: var(--ink); line-height: 1.2;
    }
    .in-sign .who em { font-style: normal; color: var(--ember); }
    .in-actions { margin-top: 26px; display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; }
    .in-actions a, .in-actions button {
      font: inherit; font-size: 10px; letter-spacing: 0.26em; text-transform: lowercase; color: var(--dim);
      background: none; border: 0; text-decoration: none; cursor: none; padding: 8px 0;
      border-bottom: 1px solid var(--faint); transition: color 0.3s, border-color 0.3s;
    }
    @media (pointer: coarse) { .in-actions a, .in-actions button { cursor: pointer; } }
    .in-actions a:hover, .in-actions button:hover { color: var(--ink); border-color: var(--ember); }

    #nogl {
      display: none; position: fixed; inset: 0; align-items: center; justify-content: center; text-align: center;
      font-size: 12px; letter-spacing: 0.22em; color: var(--dim); padding: 24px; line-height: 2;
    }
    #nogl a { color: var(--ink); }

    @media (prefers-reduced-motion: reduce) {
      #whisper, .in-line { transition-duration: 0.6s; }
      #typing.launch { animation-duration: 0.3s; }
    }
  </style>
</head>
<body class="boot">
  <canvas id="void" aria-label="A black hole. Move to orbit, hold to fall in, type to feed it words." role="img"></canvas>

  <a class="hud" id="back" href="/fun.html">← back to the maze</a>
  <button class="hud" id="sound" type="button" aria-pressed="false">sound off</button>
  <div class="hud" id="readout" aria-hidden="true">
    <span>r</span><span id="r-val">— rₛ</span>
    <span>time</span><span id="t-val">×1.00</span>
  </div>
  <div class="hud" id="hint"></div>
  <button class="hud" id="write" type="button">✎ whisper something</button>
  <input id="write-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="24" aria-label="Whisper something into the void" />

  <div id="whisper"></div>
  <div id="typing" aria-live="polite"></div>
  <div id="cursor"></div>

  <div id="inside" aria-live="polite">
    <div class="in-wrap">
      <p class="in-line" id="in-1"></p>
      <p class="in-line dim" id="in-2"></p>
      <p class="in-line dim" id="in-3"></p>
      <p class="in-line" id="in-4"></p>
      <div class="in-line in-sign" id="in-5">
        <p class="who">Robert Riopel <em>made this</em></p>
        <p class="in-line show dim" style="line-height:1.8;margin-top:6px">because it seemed important at the time.</p>
        <div class="in-actions">
          <a href="mailto:rriopel.design@gmail.com?subject=I%20crossed%20the%20event%20horizon">say hello →</a>
          <button type="button" id="climb">↑ climb back out</button>
        </div>
      </div>
    </div>
  </div>

  <div id="nogl">the void needs webgl2 to open.<br/><a href="/fun.html">← back to the maze</a></div>

<script type="x-shader/x-vertex" id="vs">#version 300 es
in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script type="x-shader/x-fragment" id="fs-scene">#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2  uRes;
uniform float uTime;
uniform vec3  uCamPos, uCamR, uCamU, uCamF;
uniform float uFov;
uniform float uFish, uAng;
uniform float uIntro;
uniform float uPulse;
uniform int   uSteps;
uniform sampler2D uText;
uniform float uTextOn, uTextSpan, uTextDist;
uniform vec3  uBackR, uBackU, uBackF;

#define RIN  2.6
#define ROUT 13.0

float hash13(vec3 p) {
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}
// Integer hash (pcg3d): no visible correlation between neighbouring star cells
float hashStar(vec3 p) {
  uvec3 v = uvec3(ivec3(p) + 32768);
  v = v * 1664525u + 1013904223u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v ^= v >> 16u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  return float(v.x) / 4294967295.0;
}
float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash13(i), hash13(i + vec3(1,0,0)), f.x),
                 mix(hash13(i + vec3(0,1,0)), hash13(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash13(i + vec3(0,0,1)), hash13(i + vec3(1,0,1)), f.x),
                 mix(hash13(i + vec3(0,1,1)), hash13(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { s += a * noise(p); p *= 2.07; a *= 0.5; }
  return s;
}

vec3 sky(vec3 d) {
  vec3 col = vec3(0.0);
  for (int l = 0; l < 2; l++) {
    float sc = l == 0 ? 80.0 : 210.0;
    float th = l == 0 ? 0.991 : 0.982;
    vec3 p = d * sc, id = floor(p);
    float h = hashStar(id);
    if (h > th) {
      vec3 c = id + 0.5 + (vec3(hashStar(id + 7.0), hashStar(id + 3.0), hashStar(id + 11.0)) - 0.5) * 0.3;
      float b = smoothstep(0.22, 0.0, length(p - c)) * (h - th) / (1.0 - th);
      vec3 tint = mix(vec3(1.0, 0.82, 0.66), vec3(0.72, 0.82, 1.0), hashStar(id + 19.0));
      col += tint * b * (l == 0 ? 4.0 : 2.0);
    }
  }
  // A faint band of dust, like looking along a galaxy
  float band = exp(-pow(d.y * 2.6 + 0.35 * sin(d.x * 2.0 + d.z), 2.0));
  col += vec3(0.32, 0.16, 0.1) * band * pow(fbm(d * 5.0), 2.0) * 0.35;

  return col;
}

// Emission + opacity of the accretion disk where a ray crosses its plane
vec4 disk(vec3 c, vec3 rd) {
  float r = length(c.xz);
  float edge = smoothstep(RIN, RIN + 0.9, r) * (1.0 - smoothstep(4.0, ROUT, r));
  if (edge <= 0.0) return vec4(0.0);

  float a = atan(c.z, c.x) + uTime * pow(r, -1.5) * 1.6; // Keplerian shear
  vec3 sp = vec3(cos(a) * r, sin(a) * r, 0.0);
  float n = fbm(vec3(sp.xy * 0.75, r * 0.35));
  float rings = 0.55 + 0.45 * sin(r * 5.3 + n * 6.0);
  float dens = edge * (0.25 + 1.1 * n * n) * mix(0.7, 1.15, rings);

  float T = clamp(pow(RIN / r, 0.8), 0.0, 1.0);
  vec3 col = mix(vec3(0.42, 0.07, 0.015), vec3(1.0, 0.4, 0.1), smoothstep(0.08, 0.55, T));
  col = mix(col, vec3(1.0, 0.9, 0.8), smoothstep(0.55, 1.0, T));

  // Relativistic beaming: the side rushing toward you is brighter and bluer
  float beta = sqrt(0.5 / (r - 1.0));
  vec3 vel = normalize(vec3(-c.z, 0.0, c.x)) * beta;
  float gamma = inversesqrt(1.0 - beta * beta);
  float D = 1.0 / (gamma * (1.0 - dot(vel, -rd)));
  float g = D * sqrt(max(0.0, 1.0 - 1.0 / r));
  col *= mix(vec3(1.3, 0.72, 0.5), vec3(0.85, 0.95, 1.25), smoothstep(0.6, 1.5, g));
  float I = pow(clamp(g, 0.0, 1.8), 2.6);

  vec3 emit = col * I * dens * (0.25 + 2.0 * T * T) * uIntro * (1.0 + uPulse);
  return vec4(emit, clamp(dens * (0.35 + 0.6 * T), 0.0, 0.95));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / min(uRes.x, uRes.y);
  vec3 v = normalize(uCamF + (uv.x * uCamR + uv.y * uCamU) * 2.0 * uFov);
  if (uFish > 0.0) {
    // Near the horizon the shadow swallows any normal lens; an equidistant fisheye
    // shows what a falling observer sees: the whole sky squeezed into a bright ring
    float lu = length(uv);
    float th = lu * uAng;
    vec2 dir = lu > 0.0 ? uv / lu : vec2(0.0);
    vec3 fish = uCamF * cos(th) + (dir.x * uCamR + dir.y * uCamU) * sin(th);
    v = normalize(mix(v, fish, uFish));
  }
  vec3 p = uCamPos;

  // Photon geodesic in Schwarzschild spacetime (units of the event horizon radius)
  vec3 hv = cross(p, v);
  float h2 = dot(hv, hv);

  vec3 col = vec3(0.0);
  float trans = 1.0, glow = 0.0;
  bool captured = false;

  for (int i = 0; i < 260; i++) {
    if (i >= uSteps) break;
    float r = length(p);
    if (r < 1.0) { captured = true; break; }
    float dt = clamp(0.075 * r, 0.02, 3.0);
    vec3 prev = p;
    v += -1.5 * h2 * p / pow(r, 5.0) * dt;
    p += v * dt;

    if (prev.y * p.y < 0.0) {
      vec3 c = mix(prev, p, prev.y / (prev.y - p.y));
      vec4 d = disk(c, normalize(v));
      col += trans * d.rgb;
      trans *= 1.0 - d.a;
      if (trans < 0.02) break;
    }
    glow += exp(-abs(r - 1.5) * 7.0) * dt;
    if (r > 70.0 && dot(p, v) > 0.0) break;
  }

  if (!captured) {
    vec3 d = normalize(v);
    col += trans * sky(d);
    // Words fed to the void sit on a plane a few radii behind it; follow the
    // escaped ray's straight-line asymptote back to that plane
    float dn = dot(d, uBackF);
    if (uTextOn > 0.0 && dn > 0.05) {
      vec3 X = p + d * (dot(uBackF * uTextDist - p, uBackF) / dn);
      vec2 q = vec2(dot(X, uBackR), dot(X, uBackU));
      vec2 tuv = vec2(q.x / (2.0 * uTextSpan) + 0.5, 0.5 - q.y / uTextSpan);
      if (all(greaterThan(tuv, vec2(0.0))) && all(lessThan(tuv, vec2(1.0)))) {
        col += trans * vec3(1.0, 0.78, 0.6) * texture(uText, tuv).r * 1.1;
      }
    }
  }
  col += vec3(1.0, 0.5, 0.2) * glow * 0.035 * uIntro * trans;

  col = 1.0 - exp(-col * 1.1);
  fragColor = vec4(pow(col, vec3(0.92)), 1.0);
}
</script>

<script type="x-shader/x-fragment" id="fs-post">#version 300 es
precision highp float;
out vec4 fragColor;
uniform sampler2D uScene;
uniform vec2  uRes;
uniform float uTime, uCA, uFlash, uFade, uGrain;

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 dc = uv - 0.5;
  float ca = uCA * dot(dc, dc);
  vec3 c = vec3(
    texture(uScene, uv - dc * ca).r,
    texture(uScene, uv).g,
    texture(uScene, uv + dc * ca).b
  );
  // Cheap bloom from the mip chain
  vec3 b = textureLod(uScene, uv, 2.5).rgb * 0.3
         + textureLod(uScene, uv, 4.0).rgb * 0.45
         + textureLod(uScene, uv, 5.5).rgb * 0.55;
  c += b * b * 1.1;
  c *= 1.0 - dot(dc, dc) * 1.1;
  uvec2 q = uvec2(gl_FragCoord.xy) * uvec2(1597334673u, 3812015801u);
  uint hn = (q.x ^ q.y ^ (uint(uTime * 60.0) * 747796405u)) * 1597334673u;
  float n = float(hn) / 4294967295.0;
  c += (n - 0.5) * uGrain;
  c = mix(c, vec3(1.0, 0.96, 0.92), uFlash);
  c *= 1.0 - uFade;
  fragColor = vec4(c, 1.0);
}
</script>

<!-- ═══════════════════════ PROGRAM ═══════════════════════ -->
<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const canvas = $('void');
const body = document.body;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;

function readLS(k) { try { return localStorage.getItem(k); } catch { return null; } }
function writeLS(k, v) { try { localStorage.setItem(k, v); } catch { /* storage unavailable */ } }

const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) {
  $('nogl').style.display = 'flex';
  body.classList.remove('boot');
  return;
}

// ═══════ GL SETUP ═══════
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src.trim());
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(fsId) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, $('vs').textContent));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, $(fsId).textContent));
  gl.bindAttribLocation(p, 0, 'aPos');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(p, i).name;
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}

let scene, post;
try {
  scene = program('fs-scene');
  post = program('fs-post');
} catch (err) {
  console.error(err);
  $('nogl').style.display = 'flex';
  body.classList.remove('boot');
  return;
}

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const sceneTex = gl.createTexture();
const fbo = gl.createFramebuffer();
let sceneW = 0, sceneH = 0;

const textCanvas = document.createElement('canvas');
textCanvas.width = 1024;
textCanvas.height = 512;
const tctx = textCanvas.getContext('2d');
const textTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, textTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, textCanvas);

// ═══════ SIZING & ADAPTIVE QUALITY ═══════
let dpr = 1, W = 0, H = 0;
let quality = coarse ? 0.45 : 0.6;   // fraction of device pixels the raymarch renders at
const Q_MIN = 0.3, Q_MAX = coarse ? 0.6 : 0.85;
const MAX_SCENE_PX = coarse ? 450e3 : 1.1e6;
let steps = coarse ? 170 : 240;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.floor(innerWidth * dpr);
  H = Math.floor(innerHeight * dpr);
  canvas.width = W;
  canvas.height = H;
  allocScene();
}
function allocScene() {
  let s = quality;
  if (W * H * s * s > MAX_SCENE_PX) s = Math.sqrt(MAX_SCENE_PX / (W * H));
  const w = Math.max(64, Math.floor(W * s)), h = Math.max(64, Math.floor(H * s));
  if (w === sceneW && h === sceneH) return;
  sceneW = w; sceneH = h;
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
resize();
addEventListener('resize', resize);

let frameAvg = 16, qualityTimer = 0;
function adaptQuality(ms, dt) {
  frameAvg = frameAvg * 0.92 + ms * 0.08;
  qualityTimer += dt;
  if (qualityTimer < 1) return;
  qualityTimer = 0;
  if (frameAvg > 24 && quality > Q_MIN) { quality = Math.max(Q_MIN, quality * 0.85); steps = Math.max(140, steps - 20); allocScene(); }
  else if (frameAvg < 13 && quality < Q_MAX) { quality = Math.min(Q_MAX, quality * 1.08); allocScene(); }
}

// ═══════ SOUND (opt-in) ═══════
const Sound = (() => {
  let ac = null, master, osc1, osc2, filter, on = false;
  function build() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = 0;
    filter = ac.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 260;
    filter.Q.value = 6;
    osc1 = ac.createOscillator(); osc1.type = 'sawtooth'; osc1.frequency.value = 55;
    osc2 = ac.createOscillator(); osc2.type = 'sine'; osc2.frequency.value = 55.4;
    const g1 = ac.createGain(); g1.gain.value = 0.12;
    const g2 = ac.createGain(); g2.gain.value = 0.5;
    osc1.connect(g1).connect(filter);
    osc2.connect(g2).connect(filter);
    filter.connect(master).connect(ac.destination);
    osc1.start(); osc2.start();
    return true;
  }
  return {
    get on() { return on; },
    toggle() {
      if (!ac && !build()) return false;
      on = !on;
      if (ac.state === 'suspended') ac.resume();
      master.gain.setTargetAtTime(on ? 0.22 : 0, ac.currentTime, 0.6);
      return on;
    },
    // Deeper and more open as you fall: time itself is slowing down
    fall(f) {
      if (!on) return;
      const t = ac.currentTime;
      osc1.frequency.setTargetAtTime(55 * (1 - f * 0.55), t, 0.2);
      osc2.frequency.setTargetAtTime(55.4 * (1 - f * 0.55), t, 0.2);
      filter.frequency.setTargetAtTime(260 + f * 1600, t, 0.2);
    },
    tick() {
      if (!on) return;
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = 'triangle';
      o.frequency.value = 1400 + Math.random() * 500;
      g.gain.setValueAtTime(0.03, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      o.connect(g).connect(master);
      o.start(t); o.stop(t + 0.08);
    },
    swallow() {
      if (!on) return;
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = 'sine';
      o.frequency.setValueAtTime(420, t);
      o.frequency.exponentialRampToValueAtTime(40, t + 1.4);
      g.gain.setValueAtTime(0.18, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
      o.connect(g).connect(master);
      o.start(t); o.stop(t + 1.6);
    },
    silence(v) {
      if (!ac) return;
      master.gain.setTargetAtTime(on && !v ? 0.22 : 0, ac.currentTime, v ? 0.4 : 1.2);
    },
  };
})();

$('sound').addEventListener('click', () => {
  const on = Sound.toggle();
  $('sound').textContent = on ? 'sound on' : 'sound off';
  $('sound').setAttribute('aria-pressed', String(on));
});

// ═══════ STATE ═══════
const HOME = 24;
const S = {
  t: 0,
  dist: 60, az: 0.55, el: 0.13,
  azOff: 0, elOff: 0, mx: 0, my: 0,
  holding: false, holdT: 0,
  mode: 'orbit',           // orbit | crossing | inside | escape
  modeT: 0,
  intro: 0, pulse: 0, flash: 0, fade: 0, shake: 0,
  pastPhoton: false,
};

const visits = (parseInt(readLS('void-visits') || '0', 10) || 0) + 1;
writeLS('void-visits', String(visits));
let crossings = parseInt(readLS('void-crossings') || '0', 10) || 0;
let lastWord = readLS('void-last-word');

// ═══════ WORDS ═══════
const words = [];
let buffer = '';
let bufferTimer = null;
const typingEl = $('typing');

function renderTyping() { typingEl.textContent = buffer; }

function launch() {
  clearTimeout(bufferTimer);
  const text = buffer.trim();
  buffer = '';
  if (!text || S.mode !== 'orbit') { renderTyping(); return; }
  typingEl.textContent = text;
  typingEl.classList.remove('launch');
  void typingEl.offsetWidth;
  typingEl.classList.add('launch');
  setTimeout(() => { typingEl.classList.remove('launch'); renderTyping(); }, 700);

  const a = Math.random() * Math.PI * 2;
  words.push({ text, t: -0.45, life: 6.5, r0: 5.2 + Math.random() * 0.8, a0: a, spin: (Math.random() < 0.5 ? -1 : 1) * 1.8 });
  lastWord = text.toLowerCase();
  writeLS('void-last-word', lastWord);
  Sound.swallow();
  advanceHint('typed');
}

function drawWords(dt) {
  if (!words.length) return false;
  tctx.clearRect(0, 0, 1024, 512);
  tctx.textAlign = 'center';
  tctx.textBaseline = 'middle';
  const span = TEXT_SPAN;
  for (let i = words.length - 1; i >= 0; i--) {
    const w = words[i];
    w.t += dt;
    if (w.t >= w.life) {
      words.splice(i, 1);
      S.pulse = Math.min(1.2, S.pulse + 0.6);
      continue;
    }
    if (w.t < 0) continue;
    const p = w.t / w.life;
    const fall = p * p * p;
    const rad = w.r0 * (1 - fall);
    const ang = w.a0 + w.spin * p * p;
    const qx = Math.cos(ang) * rad * 1.2, qy = Math.sin(ang) * rad * 0.6;
    const px = (qx / span * 0.5 + 0.5) * 1024;
    const py = (0.5 - qy / span) * 512;
    const size = 64 * (1 - p * 0.4);
    tctx.save();
    tctx.translate(px, py);
    tctx.rotate(-ang * 0.15);
    tctx.globalAlpha = Math.min(1, w.t * 2.5) * (1 - Math.pow(p, 6));
    tctx.font = `800 ${size}px Syne, sans-serif`;
    tctx.fillStyle = '#fff';
    tctx.fillText(w.text, 0, 0);
    tctx.restore();
  }
  gl.bindTexture(gl.TEXTURE_2D, textTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, textCanvas);
  return words.length > 0;
}
const TEXT_SPAN = 8;   // world units: the word plane spans ±8 × ±4

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.activeElement === $('write-input')) return;
  if (S.mode !== 'orbit') return;
  if (e.key === 'Enter') { launch(); return; }
  if (e.key === 'Backspace') { buffer = buffer.slice(0, -1); renderTyping(); return; }
  if (e.key === 'Escape') { buffer = ''; renderTyping(); return; }
  if (e.key.length !== 1 || buffer.length >= 24) return;
  if (e.key === ' ' && !buffer) { e.preventDefault(); return; }
  e.preventDefault();
  buffer += e.key;
  renderTyping();
  Sound.tick();
  clearTimeout(bufferTimer);
  bufferTimer = setTimeout(launch, 1800);
});

// Touch: a real input so the keyboard opens
const writeInput = $('write-input');
$('write').addEventListener('click', () => { writeInput.value = ''; writeInput.focus(); });
writeInput.addEventListener('input', () => { buffer = writeInput.value.slice(0, 24); renderTyping(); });
writeInput.addEventListener('keydown', e => { if (e.key === 'Enter') { writeInput.blur(); } });
writeInput.addEventListener('blur', () => { if (buffer) launch(); });

// ═══════ POINTER ═══════
const cursorEl = $('cursor');
let pointer = null;   // active pointer for touch drag/hold
let moved = 0;

addEventListener('pointermove', e => {
  cursorEl.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
  if (e.pointerType === 'mouse') {
    const nx = e.clientX / innerWidth * 2 - 1, ny = e.clientY / innerHeight * 2 - 1;
    moved += Math.hypot(nx - S.mx, ny - S.my);
    S.mx = nx; S.my = ny;
    if (moved > 0.8) advanceHint('moved');
  } else if (pointer && pointer.id === e.pointerId) {
    const dx = (e.clientX - pointer.x) / innerWidth, dy = (e.clientY - pointer.y) / innerHeight;
    pointer.x = e.clientX; pointer.y = e.clientY;
    pointer.travel += Math.abs(dx) + Math.abs(dy);
    if (!S.holding) {
      S.mx = Math.max(-1, Math.min(1, S.mx + dx * 2.4));
      S.my = Math.max(-1, Math.min(1, S.my + dy * 2.4));
      if (pointer.travel > 0.15) advanceHint('moved');
    }
  }
});

canvas.addEventListener('pointerdown', e => {
  if (S.mode !== 'orbit') return;
  if (e.pointerType === 'mouse') { if (e.button === 0) setHolding(true); return; }
  pointer = { id: e.pointerId, x: e.clientX, y: e.clientY, travel: 0 };
  pointer.timer = setTimeout(() => { if (pointer && pointer.travel < 0.03) setHolding(true); }, 260);
});
function release(e) {
  if (pointer && e.pointerId === pointer.id) { clearTimeout(pointer.timer); pointer = null; }
  setHolding(false);
}
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('blur', () => setHolding(false));
canvas.addEventListener('contextmenu', e => e.preventDefault());

function setHolding(v) {
  if (v && S.mode !== 'orbit') return;
  S.holding = v;
  body.classList.toggle('holding', v);
  if (v) advanceHint('held');
}

// ═══════ HINTS & WHISPERS ═══════
const hintEl = $('hint');
const HINTS = {
  move: coarse ? 'drag to orbit' : 'move to orbit',
  hold: coarse ? 'press and hold to fall' : 'hold to fall',
  type: coarse ? 'or whisper something to it' : 'or type something. it’s listening.',
  deeper: 'all the way in.',
  late: 'too late. nothing escapes from here.',
};
let hintStage = 'move';
let hintLocked = 0;

function setHint(text) {
  if (hintEl.textContent === text && !hintEl.classList.contains('out')) return;
  hintEl.classList.add('out');
  setTimeout(() => {
    hintEl.textContent = text;
    hintEl.classList.toggle('out', !text);
  }, 500);
}
function advanceHint(event) {
  if (event === 'moved' && hintStage === 'move') { hintStage = 'hold'; setHint(HINTS.hold); }
  else if (event === 'held' && (hintStage === 'hold' || hintStage === 'move')) { hintStage = 'type'; setTimeout(() => { if (hintStage === 'type') setHint(HINTS.type); }, 4000); }
  else if (event === 'typed' && hintStage === 'type') { hintStage = 'done'; setHint(''); }
}

const whisperEl = $('whisper');
function whisper(text, ms = 4200) {
  whisperEl.textContent = text;
  whisperEl.classList.add('show');
  clearTimeout(whisper.t);
  whisper.t = setTimeout(() => whisperEl.classList.remove('show'), ms);
}

function arrivalLine() {
  if (lastWord && crossings > 0) return `it still remembers “${lastWord}”.`;
  if (lastWord) return `it still remembers “${lastWord}”.`;
  if (crossings > 0) return 'you came back. most things don’t.';
  if (visits > 1) return 'you found it again.';
  return 'you found the edge of the website.';
}

// ═══════ CROSSING THE HORIZON ═══════
const inLines = ['in-1', 'in-2', 'in-3', 'in-4', 'in-5'].map($);

function startCrossing() {
  S.mode = 'crossing';
  S.modeT = 0;
  setHolding(false);
  buffer = '';
  renderTyping();
  Sound.silence(true);
}

function enterInside() {
  S.mode = 'inside';
  S.modeT = 0;
  crossings++;
  writeLS('void-crossings', String(crossings));
  body.classList.add('inside');

  const lines = [
    'you crossed the event horizon.',
    'to anyone watching from outside, you’re frozen at the edge. slowly reddening. forever.',
    crossings > 1 ? `in here, it’s just you again. visit no. ${crossings}.` : 'in here, it’s quiet.',
    lastWord ? `it kept “${lastWord}”. it keeps everything.` : '',
  ];
  inLines.forEach((el, i) => {
    el.classList.remove('show');
    if (i < 4) el.textContent = lines[i];
  });
  const delays = reduceMotion ? [300, 900, 1500, 2100, 2800] : [900, 3200, 6200, 8200, 10200];
  inLines.forEach((el, i) => {
    if (i === 3 && !lines[3]) return;
    setTimeout(() => { if (S.mode === 'inside') el.classList.add('show'); }, delays[i]);
  });
}

$('climb').addEventListener('click', () => {
  body.classList.remove('inside');
  inLines.forEach(el => el.classList.remove('show'));
  S.mode = 'escape';
  S.modeT = 0;
  S.dist = 1.35;
  S.flash = 1;
  S.fade = 0;
  S.pastPhoton = false;
  hintEl.textContent = '';
  hintEl.classList.add('out');
  Sound.silence(false);
  setTimeout(() => whisper('that shouldn’t be possible.', 3800), 1400);
});

// ═══════ CAMERA ═══════
function camera() {
  const d = S.dist;
  const el = S.el, az = S.az;
  const pos = [d * Math.cos(el) * Math.sin(az), d * Math.sin(el), d * Math.cos(el) * Math.cos(az)];
  let f = norm([-pos[0], -pos[1] * 0.92, -pos[2]]);
  // Near the hole, look slightly off-center so the ring fills the view
  const r0 = norm(cross(f, [0, 1, 0]));
  let u0 = cross(r0, f);
  const roll = S.fallF * S.fallF * 0.35 * Math.sin(S.t * 0.4) + (S.shake ? (Math.random() - 0.5) * S.shake * 0.02 : 0);
  const cr = Math.cos(roll), sr = Math.sin(roll);
  const r = [r0[0] * cr + u0[0] * sr, r0[1] * cr + u0[1] * sr, r0[2] * cr + u0[2] * sr];
  const u = [u0[0] * cr - r0[0] * sr, u0[1] * cr - r0[1] * sr, u0[2] * cr - r0[2] * sr];
  if (S.shake) {
    const j = S.shake * 0.004;
    f = norm([f[0] + (Math.random() - 0.5) * j, f[1] + (Math.random() - 0.5) * j, f[2] + (Math.random() - 0.5) * j]);
  }
  return { pos, f, r, u };
}
function norm(v) { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }
function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }

// ═══════ UPDATE ═══════
const rVal = $('r-val'), tVal = $('t-val');
S.fallF = 0;

function update(dt) {
  S.t += dt;
  S.modeT += dt;
  S.intro = Math.min(1, S.intro + dt / 3.2);
  S.pulse = Math.max(0, S.pulse - dt * 0.8);
  S.flash = Math.max(0, S.flash - dt * 0.7);

  // Orbit: drift + follow the pointer
  S.az += dt * (reduceMotion ? 0.008 : 0.025);
  S.azOff += (S.mx * 0.55 - S.azOff) * Math.min(1, dt * 2.2);
  S.elOff += (-S.my * 0.32 - S.elOff) * Math.min(1, dt * 2.2);
  S.el = Math.max(-0.45, Math.min(0.62, 0.13 + S.elOff));

  switch (S.mode) {
    case 'orbit': {
      if (S.dist > HOME + 0.05 && !S.holding) {
        S.dist += (HOME - S.dist) * Math.min(1, dt * 0.7);   // arrival dolly
      } else if (S.holding || S.pastPhoton) {
        S.holdT += dt;
        const k = 0.1 + S.holdT * 0.22;
        S.dist += (1.05 - S.dist) * Math.min(1, dt * k);
      } else {
        S.holdT = Math.max(0, S.holdT - dt * 3);
        S.dist += (HOME - S.dist) * Math.min(1, dt * 0.9);
      }
      // Inside the photon sphere there is no way back out
      if (S.dist < 1.5 && !S.pastPhoton) {
        S.pastPhoton = true;
        setHint(HINTS.late);
      }
      if (!S.holding && !S.pastPhoton && S.holdT > 0 && S.dist < 8 && hintStage !== 'deeper-shown') {
        setHint(HINTS.deeper);
        hintStage = hintStage === 'done' ? 'deeper-shown' : hintStage;
      }
      if (S.dist < 1.18) startCrossing();
      break;
    }
    case 'crossing':
      S.dist += (1.0 - S.dist) * Math.min(1, dt * 2);
      S.fade = Math.min(1, S.modeT / 1.1);
      if (S.modeT > 1.4) enterInside();
      break;
    case 'inside':
      S.fade = 1;
      break;
    case 'escape':
      S.dist += (HOME - S.dist) * Math.min(1, dt * (0.4 + S.modeT * 0.9));
      if (S.dist > HOME - 1.5) { S.mode = 'orbit'; S.holdT = 0; setHint(''); }
      break;
  }

  S.fallF = Math.max(0, Math.min(1, 1 - (S.dist - 1) / (HOME - 1)));
  S.shake = reduceMotion ? 0 : Math.pow(Math.max(0, 1 - (S.dist - 1) / 3), 2) * (S.mode === 'orbit' || S.mode === 'crossing' ? 1 : 0);
  Sound.fall(S.fallF);

  // Readouts
  const r = S.dist;
  if (S.mode === 'inside' || r <= 1.0005) {
    rVal.textContent = '< 1 rₛ';
    tVal.textContent = '×∞';
  } else {
    rVal.textContent = `${r.toFixed(2)} rₛ`;
    const dil = 1 / Math.sqrt(1 - 1 / r);
    tVal.textContent = dil > 999 ? '×∞' : `×${dil.toFixed(2)}`;
  }
}

// ═══════ RENDER ═══════
function render() {
  const cam = camera();
  const fov = 0.36 + Math.pow(S.fallF, 4) * 0.6;
  const fishT = Math.max(0, Math.min(1, (S.fallF - 0.78) / 0.2));
  const fish = fishT * fishT * (3 - 2 * fishT);
  const skip = S.mode === 'inside';

  if (!skip) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, sceneW, sceneH);
    gl.useProgram(scene.p);
    const u = scene.u;
    gl.uniform2f(u.uRes, sceneW, sceneH);
    gl.uniform1f(u.uTime, S.t);
    gl.uniform3fv(u.uCamPos, cam.pos);
    gl.uniform3fv(u.uCamR, cam.r);
    gl.uniform3fv(u.uCamU, cam.u);
    gl.uniform3fv(u.uCamF, cam.f);
    gl.uniform1f(u.uFov, fov);
    gl.uniform1f(u.uFish, fish);
    gl.uniform1f(u.uAng, 1.1 + fish * 2.3);
    gl.uniform1f(u.uIntro, S.intro * S.intro * (3 - 2 * S.intro));
    gl.uniform1f(u.uPulse, S.pulse);
    gl.uniform1i(u.uSteps, steps);
    gl.uniform1f(u.uTextOn, words.length ? 1 : 0);
    gl.uniform1f(u.uTextSpan, TEXT_SPAN);
    gl.uniform1f(u.uTextDist, 6);
    gl.uniform3fv(u.uBackR, cam.r);
    gl.uniform3fv(u.uBackU, cam.u);
    gl.uniform3fv(u.uBackF, norm([-cam.pos[0], -cam.pos[1], -cam.pos[2]]));
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, textTex);
    gl.uniform1i(u.uText, 1);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.generateMipmap(gl.TEXTURE_2D);
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(post.p);
  const p = post.u;
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.uniform1i(p.uScene, 0);
  gl.uniform2f(p.uRes, W, H);
  gl.uniform1f(p.uTime, S.t);
  gl.uniform1f(p.uCA, 0.012 + Math.pow(S.fallF, 3) * 0.09);
  gl.uniform1f(p.uFlash, S.flash);
  gl.uniform1f(p.uFade, S.fade);
  gl.uniform1f(p.uGrain, reduceMotion ? 0.02 : 0.045);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ═══════ LOOP ═══════
let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  const ms = now - last;
  last = now;
  update(dt);
  drawWords(dt);
  render();
  if (S.mode === 'orbit' || S.mode === 'escape') adaptQuality(ms, dt);
  requestAnimationFrame(frame);
}

// ═══════ GO ═══════
document.fonts?.load('800 64px Syne').catch(() => {});
requestAnimationFrame(frame);
setTimeout(() => body.classList.remove('boot'), 2600);
setTimeout(() => whisper(arrivalLine(), 4600), 1400);
setTimeout(() => { if (hintStage === 'move') setHint(HINTS.move); }, 5200);

})();
